name: Manejo de versiones - Bash sencillo
on:
  push:
    branches: [manejo-versiones-bash-simple]
  pull_request:
    paths:
      - '**.sh'
      - .github/workflows/demostracion-bash.yml
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar sintaxis
        run: bash -n localizar.sh demo.sh pruebas.sh
      - name: Ejecutar pruebas
        run: bash pruebas.sh
      - name: Mostrar demostracion
        run: bash demo.sh
