name: Pruebas del buscador Bash
on:
  push:
    branches: [actividad-bash-completa]
  pull_request:
    paths:
      - '**.sh'
      - .github/workflows/demostracion-bash.yml
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar sintaxis
        run: bash -n buscar.sh demo.sh pruebas.sh
      - name: Ejecutar demostracion y pruebas
        run: bash demo.sh
